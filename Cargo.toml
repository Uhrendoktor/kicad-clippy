[package]
name = "kicad-clippy"
description = "Clippy-inspired linting front end for KiCad schematics."
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Uhrendoktor/kicad-clippy"
rust-version = "1.85"
keywords = ["kicad", "electronics", "schematic", "linting"]
categories = ["development-tools", "command-line-utilities"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
geo = { version = "0.31", default-features = false }
kiutils_sexpr = "0.1.1"
kurbo = "0.13.1"
miette = { version = "7.6.0", default-features = false }
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.23"
thiserror = "2.0"
toml = "1.2.1"
unescaper = "0.2.0"
vector-text-core = "0.1.0"
vector-text-newstroke = "0.1.1"

[lints.rust]
unsafe_code = "forbid"
warnings = "deny"
missing_docs = "deny"
unused_must_use = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
missing_docs_in_private_items = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
