[workspace]
resolver = "2"
members = [
    "crates/kicad-clippy-core",
    "crates/kicad-clippy-parser",
    "crates/kicad-clippy-erc",
    "crates/kicad-clippy-rules",
    "crates/kicad-clippy-cli",
]
default-members = ["crates/kicad-clippy-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Uhrendoktor/kicad-clippy"
rust-version = "1.85"
keywords = ["kicad", "electronics", "schematic", "linting"]
categories = ["development-tools", "command-line-utilities"]
[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
kiutils_sexpr = "0.1.1"
kurbo = "0.13.1"
petgraph = { version = "0.8.3", default-features = false, features = ["std"] }
geo = { version = "0.31", default-features = false }
miette = { version = "7.6.0", default-features = false, features = ["fancy-no-backtrace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.23"
thiserror = "2.0"
unescaper = "0.2.0"
vector-text-core = "0.1.0"
vector-text-newstroke = "0.1.1"

[workspace.lints.rust]
unsafe_code = "forbid"
warnings = "deny"
missing_docs = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
missing_docs_in_private_items = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
