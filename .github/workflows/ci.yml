name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-quality:
    name: Rust quality gates
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustc --version
          cargo --version

      - name: Verify locked dependencies
        run: cargo fetch --locked

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run strict Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run workspace tests
        run: cargo test --workspace --all-features --locked

      - name: Run documentation tests
        run: cargo test --workspace --doc --locked

      - name: Build release binary
        run: cargo build --release --package kicad-clippy --locked

  native-erc:
    name: Native KiCad ERC smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install KiCad development CLI with schematic ERC support
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get install -y --no-install-recommends software-properties-common
          ppa_added=0
          for attempt in 1 2 3; do
            if sudo add-apt-repository --yes ppa:kicad/kicad-dev-nightly; then
              ppa_added=1
              break
            fi
            echo "::warning::KiCad PPA registration attempt ${attempt}/3 failed; retrying."
            sleep "$((attempt * 10))"
          done
          if [[ "$ppa_added" != "1" ]]; then
            echo "::error::Could not register the KiCad development PPA after three attempts."
            exit 1
          fi
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends kicad-nightly
          CLI="$(command -v kicad-cli-nightly || command -v kicad-cli || true)"
          if [[ -z "$CLI" ]]; then
            echo "::error::KiCad development CLI was not installed."
            exit 1
          fi
          echo "KICAD_CLI=$CLI" >> "$GITHUB_ENV"
          "$CLI" version
          "$CLI" sch erc --help

      - name: Install stable Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustc --version
          cargo --version

      - name: Run native ERC smoke test
        run: bash scripts/validate-native-erc.sh
