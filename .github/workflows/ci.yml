name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh-lockfile:
    name: Resolve workspace dependencies and commit lockfile
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Install stable Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Resolve and commit Cargo.lock changes
        shell: bash
        run: |
          set -euo pipefail
          cargo fetch
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "build: update Cargo.lock for workspace dependencies"
          git push origin "HEAD:${GITHUB_HEAD_REF}"

  rust-quality:
    name: Rust quality gates
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustc --version
          cargo --version

      - name: Verify locked dependencies
        run: cargo fetch --locked

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run strict Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run workspace tests
        run: cargo test --workspace --all-features --locked

      - name: Run documentation tests
        run: cargo test --workspace --doc --locked

      - name: Build release binary
        run: cargo build --release --package kicad-clippy --locked

  native-erc:
    name: Native KiCad ERC smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install KiCad development CLI with schematic ERC support
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get install -y --no-install-recommends software-properties-common
          ppa_added=0
          for attempt in 1 2 3; do
            if sudo add-apt-repository --yes ppa:kicad/kicad-dev-nightly; then
              ppa_added=1
              break
            fi
            echo "::warning::KiCad PPA registration attempt ${attempt}/3 failed; retrying."
            sleep "$((attempt * 10))"
          done
          if [[ "$ppa_added" != "1" ]]; then
            echo "::error::Could not register the KiCad development PPA after three attempts."
            exit 1
          fi
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get install -y --no-install-recommends kicad-nightly
          CLI="$(command -v kicad-cli-nightly || command -v kicad-cli || true)"
          if [[ -z "$CLI" ]]; then
            echo "::error::KiCad development CLI was not installed."
            exit 1
          fi
          echo "KICAD_CLI=$CLI" >> "$GITHUB_ENV"
          "$CLI" version
          "$CLI" sch erc --help

      - name: Install stable Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustc --version
          cargo --version

      - name: Run native ERC smoke test
        run: bash scripts/validate-native-erc.sh

  # Temporary lockfile generation helper while introducing the geo dependency.
  lockfile-refresh:
    if: github.event_name == 'pull_request'
    name: Generate updated Cargo.lock
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal

      - name: Resolve the workspace dependency graph
        run: cargo generate-lockfile

      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: generated-cargo-lockfile
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 1

